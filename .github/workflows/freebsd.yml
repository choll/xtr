name: FreeBSD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            release: "15.1"
            packages: gmake pkgconf cmake python3 py312-sqlite3 gcc14
            run: |
              export CC=gcc14 CXX=g++14 AR=gcc-ar14 RANLIB=gcc-ranlib14
              gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              gmake
              gmake check
          - name: clang
            release: "15.1"
            packages: gmake pkgconf cmake python3 py312-sqlite3
            run: |
              export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib
              gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              gmake
              gmake check
          - name: gcc-cmake
            release: "15.1"
            packages: gmake pkgconf cmake python3 py312-sqlite3 gcc14
            run: |
              CC=gcc14 CXX=g++14 gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              CONAN=$PWD/build/.venv/bin/conan
              mkdir -p build/cmake && cd build/cmake
              export CC=gcc14 CXX=g++14 RANLIB=gcc-ranlib14 AR=gcc-ar14
              $CONAN install ../.. -g CMakeDeps -g CMakeToolchain --output-folder=${PWD} --build missing --lockfile-partial -s compiler.libcxx=libstdc++11
              cmake ../.. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DBUILD_TESTING=ON -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_INSTALL_PREFIX=/tmp/install -DCMAKE_AR=`which $AR` -DCMAKE_RANLIB=`which $RANLIB`
              cmake --build .
              cmake --build . --target install
              cmake --build . --target test
          - name: clang-cmake
            release: "15.1"
            packages: gmake pkgconf cmake python3 py312-sqlite3
            run: |
              gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              CONAN=$PWD/build/.venv/bin/conan
              mkdir -p build/cmake && cd build/cmake
              export CC=clang CXX=clang++ RANLIB=llvm-ranlib AR=llvm-ar
              $CONAN install ../.. -g CMakeDeps -g CMakeToolchain --output-folder=${PWD} --build missing --lockfile-partial
              cmake ../.. -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DBUILD_TESTING=ON -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_INSTALL_PREFIX=/tmp/install -DCMAKE_AR=`which $AR` -DCMAKE_RANLIB=`which $RANLIB`
              cmake --build .
              cmake --build . --target install
              cmake --build . --target test
          - name: gcc-14
            release: "14.4"
            packages: gmake pkgconf cmake python3 py312-sqlite3 gcc14
            run: |
              export CC=gcc14 CXX=g++14 AR=gcc-ar14 RANLIB=gcc-ranlib14
              gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              gmake
              gmake check
          - name: clang-14
            release: "14.4"
            packages: gmake pkgconf cmake python3 py312-sqlite3
            run: |
              export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib
              gmake conan-profile
              cat conan_profile_freebsd >> ~/.conan2/profiles/default
              gmake
              gmake check

    name: freebsd-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y ${{ matrix.packages }}
          run: ${{ matrix.run }}
